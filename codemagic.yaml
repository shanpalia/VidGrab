workflows:
  vidgrab-android:
    name: VidGrab Android
    max_build_duration: 60
    environment:
      node: latest
      java: 17
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app and generate Android project
        script: npm run android:prepare
      - name: Build Android APK
        script: cd android && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
