workflows:
  vidgrab-android:
    name: VidGrab Android Signed Release
    max_build_duration: 60
    environment:
      node: latest
      java: 21
      android_signing:
        - paliaapk-release
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Prepare Android app
        script: npm run android:prepare
      - name: Build signed release APK
        script: |
          cd android
          ./gradlew assembleRelease
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/VidGrab.apk
    artifacts:
      - android/app/build/outputs/apk/release/VidGrab.apk
