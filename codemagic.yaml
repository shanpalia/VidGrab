workflows:
  vidgrab-debug:
    name: VidGrab Android Debug APK
    max_build_duration: 60
    environment:
      vars:
        PACKAGE_NAME: "com.shanpalia.vidgrab"
      java: 17
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
    scripts:
      - name: Ensure Gradle launcher is executable
        script: chmod +x ./gradlew
      - name: Set Android SDK location
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build debug APK
        script: ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  vidgrab-release:
    name: VidGrab Android Release APK and AAB
    max_build_duration: 60
    environment:
      vars:
        PACKAGE_NAME: "com.shanpalia.vidgrab"
      # Add your Codemagic keystore reference here when you want a signed release.
      # android_signing:
      #   - vidgrab_keystore
      java: 17
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
    scripts:
      - name: Ensure Gradle launcher is executable
        script: chmod +x ./gradlew
      - name: Set Android SDK location
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build release APK and AAB
        script: |
          ./gradlew assembleRelease bundleRelease
    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/bundle/release/*.aab
